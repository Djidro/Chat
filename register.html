<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0612"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Love Connect"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><title>Register · Love Connect</title></head>
<body data-page="register"><div class="auth"><div class="card">
<div class="brand">Love Connect ❤</div><p class="muted center" style="margin-bottom:20px">Create your free account</p>
<form id="regForm"><label class="field"><span>Username (letters, numbers, _)</span><input id="username" maxlength="20" autocapitalize="none" autocomplete="username" required></label>
<label class="field"><span>Display name</span><input id="display" maxlength="40" required></label>
<label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
<label class="field"><span>Password (min 8 characters)</span><input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label class="field"><span>Repeat password</span><input id="password2" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="btn block" id="regBtn">Create account</button></form>
<div id="done" class="hidden center"><h2>Check your email 💌</h2><p class="muted" style="margin-top:8px">We sent a verification link. Click it, then log in.</p><p style="margin-top:14px"><a href="login.html">Go to log in</a></p></div>
<p class="center muted" style="margin-top:14px">Already have an account? <a href="login.html">Log in</a></p>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="supabase.js"></script><script src="auth.js"></script></body></html>
